<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hermes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="theme-toggle" class="theme-toggle" type="button">whimsical</button>

  <main class="dash">

    <!-- greeting row -->
    <section class="greeting">
      <div class="greeting-text">
        <h1 class="hi">hi, <span id="name">there</span> <span class="wave">:3</span></h1>
        <p class="sub">you're using <b>hermes</b> dashboard</p>
      </div>

      <button id="avatar-btn" class="avatar" title="tap me" aria-label="account"></button>
    </section>

    <!-- dropdown that appears when avatar is clicked -->
    <div id="account-menu" class="account-menu" hidden>
      <button id="logout-btn" class="menu-item">log out 👋</button>
    </div>

    <!-- cards -->
    <section class="cards">

      <a href="add.html" class="card-tile">
        <span class="tile-emoji">📥</span>
        <span class="tile-title">add a youtube link</span>
        <span class="tile-sub">queue something for tonight</span>
      </a>

      <button type="button" class="card-tile" id="watch-tile">
        <span class="tile-emoji">📺</span>
        <span class="tile-title">watch videos</span>
        <span class="tile-sub">LAN only — tap to open</span>
      </button>

    </section>
  
    <!-- watch videos gate -->
    <div id="watch-modal" class="modal" hidden>
      <div class="modal-card">
        <h2 class="modal-title">one sec 🎬</h2>

        <p class="modal-body">
          this only works if you're on the <b>same wifi</b> as the server.
        </p>

        <label class="modal-check">
          <input type="checkbox" id="skip-warn">
          <span>don't show that warning again</span>
        </label>

        <input
          type="password"
          id="viewer-pw"
          class="modal-input"
          placeholder="viewer password"
          autocomplete="off"
        >

        <p id="modal-msg" class="message"></p>

        <div class="modal-actions">
          <button type="button" class="modal-btn ghost" id="modal-cancel">cancel</button>
          <button type="button" class="modal-btn solid" id="modal-go">open player</button>
        </div>
      </div>
    </div>

  </main>

  <script src="js/dashboard.js"></script>

</body>
</html>
